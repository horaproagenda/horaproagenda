    <!-- Critical inline styles to prevent FOUC and improve FCP -->
    <style>
      :root{--background:0 0% 100%;--foreground:240 10% 3.9%}

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Poppins é a fonte principal: carrega bloqueante (síncrono) para
         garantir métrica idêntica entre iOS e Android antes da agenda
         renderizar. display=swap permite fallback tipográfico sem FOIT. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />

    <!-- Fontes secundárias (DM Sans / Playfair) podem carregar de forma assíncrona -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" />
    </noscript>

    <!-- Gate de renderização: marca <html> com .fonts-ready assim que a
         Poppins terminar de carregar. CSS oculta áreas [data-fonts-gate]
         até esse momento, eliminando variação de métricas entre iOS/Android. -->
    <script>
      (function () {
        var html = document.documentElement;
        function ready() { html.classList.add('fonts-ready'); }
        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('400 1em Poppins'),
            document.fonts.load('500 1em Poppins'),
            document.fonts.load('600 1em Poppins'),
          ]).then(ready).catch(ready);
          // Failsafe — nunca trava a UI por mais de 1.2s
          setTimeout(ready, 1200);
        } else {
          ready();
        }
      })();
    </script>

  <body>
    <div id="root">
      <!-- Initial loading state to prevent blank screen during CSS load -->
      <div class="loading-screen" id="initial-loader">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove initial loader once app is ready
      window.addEventListener('load', function() {
        var loader = document.getElementById('initial-loader');
        if (loader) loader.remove();
      });
    </script>
